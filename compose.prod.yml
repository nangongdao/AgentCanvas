name: agentcanvas-prod

x-prod-environment: &prod-environment
  APP_ENV: production
  AUTH_MODE: token
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
  ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:?ADMIN_API_TOKEN is required}
  EDITOR_API_TOKEN: ${EDITOR_API_TOKEN:-}
  VIEWER_API_TOKEN: ${VIEWER_API_TOKEN:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
  OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
  REDIS_URL: redis://redis:6379/0
  REDIS_AOF_DIR: /redis-data
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
  DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-5}
  DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-10}
  DATABASE_POOL_TIMEOUT_SECONDS: ${DATABASE_POOL_TIMEOUT_SECONDS:-30}
  DATABASE_POOL_RECYCLE_SECONDS: ${DATABASE_POOL_RECYCLE_SECONDS:-1800}
  DATABASE_MIGRATION_LOCK_TIMEOUT_SECONDS: ${DATABASE_MIGRATION_LOCK_TIMEOUT_SECONDS:-60}
  EXECUTION_WORKER_POLL_SECONDS: ${EXECUTION_WORKER_POLL_SECONDS:-0.5}
  EXECUTION_LEASE_SECONDS: ${EXECUTION_LEASE_SECONDS:-30}
  EXECUTION_LEASE_MAX_ATTEMPTS: ${EXECUTION_LEASE_MAX_ATTEMPTS:-3}
  EXECUTION_SCHEDULER_POLL_SECONDS: ${EXECUTION_SCHEDULER_POLL_SECONDS:-1.0}
  EXECUTION_SCHEDULER_BATCH_SIZE: ${EXECUTION_SCHEDULER_BATCH_SIZE:-100}
  WORKFLOW_SCHEDULE_POLL_SECONDS: ${WORKFLOW_SCHEDULE_POLL_SECONDS:-1.0}
  WORKFLOW_SCHEDULE_BATCH_SIZE: ${WORKFLOW_SCHEDULE_BATCH_SIZE:-100}
  WORKFLOW_CALLBACK_POLL_SECONDS: ${WORKFLOW_CALLBACK_POLL_SECONDS:-1.0}
  WORKFLOW_CALLBACK_BATCH_SIZE: ${WORKFLOW_CALLBACK_BATCH_SIZE:-100}
  WORKFLOW_CALLBACK_LEASE_SECONDS: ${WORKFLOW_CALLBACK_LEASE_SECONDS:-30}
  WORKFLOW_CALLBACK_DEFAULT_TIMEOUT_SECONDS: ${WORKFLOW_CALLBACK_DEFAULT_TIMEOUT_SECONDS:-10}
  WORKFLOW_CALLBACK_DEFAULT_MAX_ATTEMPTS: ${WORKFLOW_CALLBACK_DEFAULT_MAX_ATTEMPTS:-5}
  WORKFLOW_CALLBACK_DEFAULT_RETRY_DELAY_SECONDS: ${WORKFLOW_CALLBACK_DEFAULT_RETRY_DELAY_SECONDS:-10}
  RATE_LIMIT_WORKFLOW_API_REQUESTS: ${RATE_LIMIT_WORKFLOW_API_REQUESTS:-60}
  EVENT_RELAY_POLL_SECONDS: ${EVENT_RELAY_POLL_SECONDS:-0.5}
  EVENT_RELAY_BATCH_SIZE: ${EVENT_RELAY_BATCH_SIZE:-100}
  EVENT_STREAM_MAXLEN: ${EVENT_STREAM_MAXLEN:-10000}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
  APP_DATA_DIR: /app/data
  STARTUP_MIGRATIONS: "false"
  VECTOR_BACKEND: pgvector

x-prod-service: &prod-service
  env_file:
    - path: ${AGENTCANVAS_ENV_FILE:-.env.production}
      required: true
  read_only: true
  tmpfs:
    - /tmp:size=128m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agentcanvas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-agentcanvas}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    shm_size: 256m
    mem_limit: 2g
    cpus: 2
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  migrate:
    <<: *prod-service
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ${BACKEND_IMAGE:-agentcanvas-backend}:${IMAGE_TAG:-local}
    command: ["python", "-m", "app.services.migrate"]
    environment: *prod-environment
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backend-data:/app/data
    restart: "no"

  bootstrap:
    <<: *prod-service
    image: ${BACKEND_IMAGE:-agentcanvas-backend}:${IMAGE_TAG:-local}
    command: ["python", "-m", "app.services.bootstrap"]
    environment: *prod-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    volumes:
      - backend-data:/app/data
    restart: "no"

  redis:
    image: redis:7-alpine
    user: "999:1000"
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # 以 redis 用户(999)直接启动,跳过 entrypoint 的 root→setpriv 降权分支,
    # 因此无需 SETUID/SETGID 能力;redis-data 卷属主即 999,亦无需 CHOWN/DAC_OVERRIDE。
    # 若曾以 root 启动遗留 root 属主的文件,先手动 chown 卷再启动,而不是放宽能力。
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    mem_limit: 512m
    cpus: 0.5
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  backend:
    <<: *prod-service
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ${BACKEND_IMAGE:-agentcanvas-backend}:${IMAGE_TAG:-local}
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      <<: *prod-environment
      APP_PROCESS_ROLE: api
    volumes:
      - backend-data:/app/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 2g
    cpus: 2
    restart: unless-stopped
    deploy:
      replicas: 2

  worker:
    <<: *prod-service
    image: ${BACKEND_IMAGE:-agentcanvas-backend}:${IMAGE_TAG:-local}
    command: ["python", "-m", "app.services.worker"]
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      <<: *prod-environment
      APP_PROCESS_ROLE: worker
    volumes:
      - backend-data:/app/data
    mem_limit: 2g
    cpus: 2
    restart: unless-stopped
    deploy:
      replicas: 2

  scheduler:
    <<: *prod-service
    image: ${BACKEND_IMAGE:-agentcanvas-backend}:${IMAGE_TAG:-local}
    command: ["python", "-m", "app.services.scheduler"]
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      <<: *prod-environment
      APP_PROCESS_ROLE: scheduler
    mem_limit: 512m
    cpus: 0.5
    restart: unless-stopped

  relay:
    <<: *prod-service
    image: ${BACKEND_IMAGE:-agentcanvas-backend}:${IMAGE_TAG:-local}
    command: ["python", "-m", "app.services.relay"]
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      <<: *prod-environment
      APP_PROCESS_ROLE: relay
    mem_limit: 512m
    cpus: 0.5
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ${FRONTEND_IMAGE:-agentcanvas-frontend}:${IMAGE_TAG:-local}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /var/cache/nginx:size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  backup:
    <<: *prod-service
    profiles: ["backup"]
    image: ${BACKEND_IMAGE:-agentcanvas-backend}:${IMAGE_TAG:-local}
    command: ["python", "-m", "app.services.backup", "backup", "/backups/agentcanvas-backup.tar.gz", "--quiesced"]
    environment: *prod-environment
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backend-data:/app/data:ro
      - backup-data:/backups
    restart: "no"

  restore:
    <<: *prod-service
    profiles: ["restore"]
    image: ${BACKEND_IMAGE:-agentcanvas-backend}:${IMAGE_TAG:-local}
    command: ["python", "-m", "app.services.backup", "restore", "/backups/agentcanvas-backup.tar.gz", "--data-dir", "/restore-data"]
    environment:
      <<: *prod-environment
      PG_RESTORE_TARGET_DATABASE_URL: ${PG_RESTORE_TARGET_DATABASE_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backup-data:/backups:ro
      - restore-data:/restore-data
    restart: "no"

  restore-drill:
    <<: *prod-service
    profiles: ["restore"]
    image: ${BACKEND_IMAGE:-agentcanvas-backend}:${IMAGE_TAG:-local}
    command: ["python", "-m", "app.services.restore_drill"]
    environment:
      <<: *prod-environment
      PG_RESTORE_TARGET_DATABASE_URL: ${PG_RESTORE_TARGET_DATABASE_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  restore-api:
    <<: *prod-service
    profiles: ["restore"]
    image: ${BACKEND_IMAGE:-agentcanvas-backend}:${IMAGE_TAG:-local}
    environment:
      <<: *prod-environment
      DATABASE_URL: ${PG_RESTORE_TARGET_DATABASE_URL:-}
      APP_PROCESS_ROLE: api
      APP_DATA_DIR: /restore-data
    volumes:
      - restore-data:/restore-data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz')"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: "no"

  restore-worker:
    <<: *prod-service
    profiles: ["restore"]
    image: ${BACKEND_IMAGE:-agentcanvas-backend}:${IMAGE_TAG:-local}
    command: ["python", "-m", "app.services.worker"]
    environment:
      <<: *prod-environment
      DATABASE_URL: ${PG_RESTORE_TARGET_DATABASE_URL:-}
      APP_PROCESS_ROLE: worker
      APP_DATA_DIR: /restore-data
    volumes:
      - restore-data:/restore-data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "9090"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: 0.5
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.0.2
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    ports:
      - "${GRAFANA_BIND_ADDRESS:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: 0.5
    restart: unless-stopped

volumes:
  postgres-data:
  backend-data:
  redis-data:
  backup-data:
  restore-data:
  prometheus-data:
  grafana-data:
