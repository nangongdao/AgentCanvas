# Local single-host stack. Production operators should use compose.prod.yml.
name: agentcanvas

x-backend-environment: &backend-environment
  APP_ENV: ${APP_ENV:-development}
  AUTH_MODE: ${AUTH_MODE:-disabled}
  SECRET_KEY: ${SECRET_KEY:-}
  ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-}
  EDITOR_API_TOKEN: ${EDITOR_API_TOKEN:-}
  VIEWER_API_TOKEN: ${VIEWER_API_TOKEN:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
  OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
  REDIS_URL: ${REDIS_URL:-}
  DATABASE_URL: ${DATABASE_URL:-}
  DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-5}
  DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-10}
  DATABASE_POOL_TIMEOUT_SECONDS: ${DATABASE_POOL_TIMEOUT_SECONDS:-30}
  DATABASE_POOL_RECYCLE_SECONDS: ${DATABASE_POOL_RECYCLE_SECONDS:-1800}
  DATABASE_MIGRATION_LOCK_TIMEOUT_SECONDS: ${DATABASE_MIGRATION_LOCK_TIMEOUT_SECONDS:-60}
  WORKFLOW_SCHEDULE_POLL_SECONDS: ${WORKFLOW_SCHEDULE_POLL_SECONDS:-1.0}
  WORKFLOW_SCHEDULE_BATCH_SIZE: ${WORKFLOW_SCHEDULE_BATCH_SIZE:-100}
  WORKFLOW_CALLBACK_POLL_SECONDS: ${WORKFLOW_CALLBACK_POLL_SECONDS:-1.0}
  WORKFLOW_CALLBACK_BATCH_SIZE: ${WORKFLOW_CALLBACK_BATCH_SIZE:-100}
  WORKFLOW_CALLBACK_LEASE_SECONDS: ${WORKFLOW_CALLBACK_LEASE_SECONDS:-30}
  WORKFLOW_CALLBACK_DEFAULT_TIMEOUT_SECONDS: ${WORKFLOW_CALLBACK_DEFAULT_TIMEOUT_SECONDS:-10}
  WORKFLOW_CALLBACK_DEFAULT_MAX_ATTEMPTS: ${WORKFLOW_CALLBACK_DEFAULT_MAX_ATTEMPTS:-5}
  WORKFLOW_CALLBACK_DEFAULT_RETRY_DELAY_SECONDS: ${WORKFLOW_CALLBACK_DEFAULT_RETRY_DELAY_SECONDS:-10}
  RATE_LIMIT_WORKFLOW_API_REQUESTS: ${RATE_LIMIT_WORKFLOW_API_REQUESTS:-60}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
  APP_DATA_DIR: /app/data
  STARTUP_MIGRATIONS: "false"

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: agentcanvas-backend:dev
    command: ["python", "-m", "app.services.migrate"]
    environment: *backend-environment
    volumes:
      - backend-data:/app/data
    restart: "no"
    logging: *default-logging

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: agentcanvas-backend:dev
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment: *backend-environment
    volumes:
      - backend-data:/app/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 2g
    cpus: 2
    restart: unless-stopped
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: agentcanvas-frontend:dev
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:8080"
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped
    logging: *default-logging

  redis:
    image: redis:7-alpine
    profiles: ["redis"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    mem_limit: 512m
    cpus: 0.5
    restart: unless-stopped
    logging: *default-logging

volumes:
  backend-data:
  redis-data:
