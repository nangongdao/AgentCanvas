[project]
name = "agentcanvas-backend"
version = "1.0.0"
description = "MCP-based visual multi-agent orchestration platform - backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sse-starlette>=2.1",
    "pydantic>=2.9",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20,<0.21",
    "asyncpg>=0.30,<1",
    "alembic>=1.13",
    "langgraph>=1.0.10,<2",
    "langgraph-checkpoint-postgres>=3.1.2,<4",
    "langgraph-checkpoint-sqlite>=3.0.1,<5",
    "psycopg[binary]>=3.2,<4",
    "mcp>=2.0,<3",
    "httpx>=0.27",
    "httpx2>=2.5,<3",
    "redis>=5.0",
    "chromadb>=0.5",
    "pgvector>=0.5,<0.6",
    "cryptography>=43.0",
    "croniter>=6.2.4,<7",
    "PyJWT>=2.10,<3",
    "pypdf>=6.15.0",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.12",
    "jsonschema>=4.23",
    "opentelemetry-sdk>=1.44,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.44,<2",
    "opentelemetry-exporter-prometheus>=0.65b0,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "pip-audit>=2.10",
    "pyyaml>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "postgres: requires a real PostgreSQL service",
    "redis: requires a real Redis 5+ service",
]
