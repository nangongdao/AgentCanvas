name: Performance Baseline

on:
  workflow_dispatch:
  schedule:
    - cron: "17 19 * * 3"

permissions:
  contents: read

jobs:
  full-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install uv==0.11.32

      - name: Sync backend dependencies
        working-directory: backend
        run: python -m uv sync --frozen

      - name: Backend full performance matrix
        working-directory: backend
        run: python -m uv run python -m scripts.performance_budget --full --output performance-full.json

      - uses: pnpm/action-setup@v4
        with:
          version: 11.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build and enforce bundle budget
        working-directory: frontend
        run: pnpm build

      - name: Install Chromium
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Canvas 100-node/500-edge performance gate
        working-directory: frontend
        run: pnpm exec playwright test e2e/performance.spec.ts

      - name: Upload performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-performance-${{ github.run_id }}
          path: |
            backend/performance-full.json
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
