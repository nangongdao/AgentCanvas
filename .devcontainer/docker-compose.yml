version: '3.8'

services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    environment:
      - DATABASE_URL=postgresql+asyncpg://agentcanvas:devpassword@postgres:5432/agentcanvas
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    networks:
      - agentcanvas-dev

  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=agentcanvas
      - POSTGRES_PASSWORD=devpassword
      - POSTGRES_DB=agentcanvas
    networks:
      - agentcanvas-dev

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks:
      - agentcanvas-dev

volumes:
  postgres-data:
  redis-data:

networks:
  agentcanvas-dev:
